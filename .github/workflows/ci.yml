name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint & format check
        run: npm run lint

      - name: Model is up to date
        run: |
          npm run model:generate
          git diff --exit-code -- packages/core/model/default.glb || {
            echo "::error::packages/core/model/default.glb is out of date. Run 'npm run model:generate' and commit the result."
            exit 1
          }

      - name: Build packages and demo
        run: npm run build
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Bundle size
        run: node packages/core/scripts/size.mjs
