# Publishes both packages to npm and creates a GitHub Release when a version tag is pushed.
#
#   npm run version          # apply changesets → bumps package.json + CHANGELOG.md
#   git commit -am "release: v1.2.3"
#   npm run release:tag      # creates the tag v1.2.3 from packages/core/package.json
#   git push && git push --tags
#
# Requires the repository secret NPM_TOKEN (npm "Automation" granular access token with
# publish rights on the @oozkul scope). See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          NG=$(node -p "require('./packages/angular/package.json').version")
          echo "tag=$TAG core=$CORE angular=$NG"
          if [ "$TAG" != "$CORE" ] || [ "$TAG" != "$NG" ]; then
            echo "::error::Tag v$TAG does not match package versions (core $CORE, angular $NG). Run 'npm run version' and commit before tagging."
            exit 1
          fi
          if [ -n "$(ls .changeset/*.md 2>/dev/null | grep -v README.md)" ]; then
            echo "::error::There are unapplied changesets. Run 'npm run version' and commit before tagging."
            exit 1
          fi

      - name: Build
        run: npm run build:packages

      - name: Lint & typecheck
        run: npm run lint && npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Publish @oozkul/dental-3d
        run: npm publish --workspace packages/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @oozkul/dental-3d-angular
        # ng-packagr output lives in dist/ and carries its own package.json
        run: npm publish ./packages/angular/dist --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          cat release-notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
